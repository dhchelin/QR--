<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Photo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <img id="photo" alt="Random photo">

  <script>
    const photos = [
      "photo1.jpg",
      "photo2.jpg",
      "photo3.jpg"
    ];

    const randomIndex = Math.floor(Math.random() * photos.length);

    document.getElementById("photo").src = photos[randomIndex];
  </script>
</body>
</html>
